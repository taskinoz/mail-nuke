services:
  mail-nuke:
    build: .
    container_name: mail-nuke
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIL_NUKE_PORT:-8765}:8765"
    environment:
      MAIL_NUKE_DATA_DIR: /data
      MAIL_NUKE_SECRET_KEY: ${MAIL_NUKE_SECRET_KEY:-}
      MAIL_NUKE_RECONCILE_INTERVAL_SECONDS: ${MAIL_NUKE_RECONCILE_INTERVAL_SECONDS:-300}
      MAIL_NUKE_TRAIN_INTERVAL_SECONDS: ${MAIL_NUKE_TRAIN_INTERVAL_SECONDS:-604800}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
